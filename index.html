<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kara-Web Utep</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #00d2ff;
      --accent2: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Top Header */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .brand { font-weight: 800; font-size: 1.1rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .btn {
      background: linear-gradient(135deg, var(--accent), #0284c7); color: #fff; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    .btn.secondary { background: #1e293b; color: var(--text); }
    .btn.danger { background: #dc2626; }

    /* Video Stage */
    .stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 38dvh;
      background: #000; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid #1e293b;
    }
    iframe { width: 100%; height: 100%; border: none; }
    .placeholder { text-align: center; color: var(--muted); padding: 20px; }
    .placeholder h3 { color: var(--text); margin-bottom: 6px; font-size: 1.1rem; }

    /* Now Playing Bar */
    .now-playing {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px; background: var(--card); border-bottom: 1px solid #1e293b;
    }
    .np-info { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .np-code { color: var(--accent); font-weight: 700; margin-right: 6px; font-family: monospace; font-size: 0.95rem; }
    .np-title { font-weight: 600; font-size: 0.9rem; }

    /* Keypad Input Bar */
    .keypad-bar {
      display: flex; gap: 8px; padding: 10px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .keypad-bar input {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 10px 12px; border-radius: 10px; font-size: 1rem; outline: none;
    }

    /* Tabs */
    .tabs { display: flex; background: #0f1524; border-bottom: 1px solid #1e293b; }
    .tab {
      flex: 1; text-align: center; padding: 10px; font-weight: 600; font-size: 0.9rem;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* List Area */
    .list-container { flex: 1; overflow-y: auto; padding: 10px 16px 30px; }
    .song-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); padding: 12px; border-radius: 12px; margin-bottom: 8px;
      border: 1px solid #1e293b;
    }
    .song-meta { overflow: hidden; }
    .song-code { font-family: monospace; color: var(--accent); font-weight: 700; font-size: 0.9rem; }
    .song-title { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 0.8rem; color: var(--muted); }
    .song-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .status-banner {
      background: #1e293b; color: var(--accent); font-size: 0.8rem; padding: 8px 16px; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KARA-WEB UTEP</div>
    <button id="authBtn" class="btn" onclick="handleAuthClick()">Connect Drive</button>
  </header>

  <div id="statusBanner" class="status-banner">Tap "Connect Drive" to load your _USRDAT songbook</div>

  <!-- Video Player Stage -->
  <div class="stage" id="playerStage">
    <div class="placeholder">
      <h3>Ready to Sing</h3>
      <p>Enter a 5-digit song code or pick a track below</p>
    </div>
  </div>

  <!-- Now Playing Controls -->
  <div class="now-playing">
    <div class="np-info">
      <span class="np-code" id="npCode">-----</span>
      <span class="np-title" id="npTitle">No song playing</span>
    </div>
    <button class="btn secondary" onclick="playNext()">Next ⏭</button>
  </div>

  <!-- Search / Code Entry -->
  <div class="keypad-bar">
    <input type="text" id="searchInput" placeholder="Search song, artist, or 5-digit code..." oninput="renderSongs()" />
    <button class="btn" onclick="reserveByCode()">Reserve</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabSongs" onclick="switchTab('songs')">Songbook (<span id="songCount">0</span>)</div>
    <div class="tab" id="tabQueue" onclick="switchTab('queue')">Reserved (<span id="queueCount">0</span>)</div>
  </div>

  <!-- Lists -->
  <div class="list-container" id="listContainer"></div>

  <script>
    // Your Google Cloud & Drive Configuration
    const CLIENT_ID = '369493536817-6bp9tpahjnlpg0vclomful0bj7vegit1.apps.googleusercontent.com';
    const FOLDER_ID = '1M129iMUrGbxsEjlNHv206OL1pvNDe4QP';
    const SCOPES = 'https://www.googleapis.com/auth/drive.readonly';

    let tokenClient;
    let accessToken = null;
    let songs = [];
    let queue = [];
    let currentTab = 'songs';

    window.onload = () => {
      tokenClient = google.accounts.oauth2.initTokenClient({
        client_id: CLIENT_ID,
        scope: SCOPES,
        callback: (tokenResponse) => {
          if (tokenResponse && tokenResponse.access_token) {
            accessToken = tokenResponse.access_token;
            document.getElementById('authBtn').innerText = 'Sync Drive';
            fetchAllDriveFiles();
          }
        },
      });
    };

    function handleAuthClick() {
      tokenClient.requestAccessToken({ prompt: accessToken ? '' : 'consent' });
    }

    async function fetchAllDriveFiles() {
      const banner = document.getElementById('statusBanner');
      banner.innerText = 'Loading songs from Google Drive...';
      songs = [];
      let pageToken = null;

      try {
        do {
          const query = encodeURIComponent(`'${FOLDER_ID}' in parents and trashed = false`);
          let url = `https://www.googleapis.com/drive/v3/files?q=${query}&fields=nextPageToken,files(id,name)&pageSize=1000&orderBy=name`;
          if (pageToken) url += `&pageToken=${pageToken}`;

          const res = await fetch(url, {
            headers: { Authorization: `Bearer ${accessToken}` }
          });
          const data = await res.json();

          if (data.error) {
            banner.innerText = 'Drive Error: ' + data.error.message;
            return;
          }

          if (data.files) {
            data.files.forEach((file) => {
              if (file.name.match(/\.(avi|mp4|mkv|mov)$/i)) {
                songs.push(parseFilename(file));
              }
            });
          }

          pageToken = data.nextPageToken;
          banner.innerText = `Loaded ${songs.length} songs...`;
        } while (pageToken);

        songs.sort((a, b) => a.code.localeCompare(b.code));
        banner.innerText = `Connected! ${songs.length} songs ready in _USRDAT`;
        updateCounts();
        renderSongs();
      } catch (err) {
        banner.innerText = 'Failed to load files: ' + err.message;
      }
    }

    function parseFilename(file) {
      // Matches format: 47001-34+35 - Ariana ft Doja, Megan.avi
      const cleanName = file.name.replace(/\.[^/.]+$/, '');
      const match = cleanName.match(/^(\d{4,6})-(.+)$/);
      let code = '00000';
      let rest = cleanName;

      if (match) {
        code = match[1];
        rest = match[2].trim();
      }

      const parts = rest.split(' - ');
      const title = parts[0] ? parts[0].trim() : rest;
      const artist = parts.length > 1 ? parts.slice(1).join(' - ').trim() : 'Karaoke Track';

      return { id: file.id, code, title, artist, raw: cleanName };
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabSongs').classList.toggle('active', tab === 'songs');
      document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
      renderSongs();
    }

    function updateCounts() {
      document.getElementById('songCount').innerText = songs.length;
      document.getElementById('queueCount').innerText = queue.length;
    }

    function renderSongs() {
      const container = document.getElementById('listContainer');
      const term = document.getElementById('searchInput').value.toLowerCase().trim();
      container.innerHTML = '';

      if (currentTab === 'queue') {
        if (queue.length === 0) {
          container.innerHTML = '<div class="placeholder"><p>Queue is empty. Reserve a song!</p></div>';
          return;
        }
        queue.forEach((song, idx) => {
          const div = document.createElement('div');
          div.className = 'song-item';
          div.innerHTML = `
            <div class="song-meta">
              <div class="song-code">#${idx + 1} • ${song.code}</div>
              <div class="song-title">${song.title}</div>
              <div class="song-artist">${song.artist}</div>
            </div>
            <div class="song-actions">
              <button class="btn" onclick="playSpecific(${idx})">Play</button>
              <button class="btn danger" onclick="removeFromQueue(${idx})">✕</button>
            </div>
          `;
          container.appendChild(div);
        });
        return;
      }

      const filtered = songs.filter(s =>
        s.code.includes(term) ||
        s.title.toLowerCase().includes(term) ||
        s.artist.toLowerCase().includes(term)
      );

      // Render max 150 items at a time for smooth iOS scrolling
      filtered.slice(0, 150).forEach(song => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
          <div class="song-meta">
            <div class="song-code">${song.code}</div>
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.artist}</div>
          </div>
          <div class="song-actions">
            <button class="btn secondary" onclick="playNow('${song.id}')">Play</button>
            <button class="btn" onclick="addToQueue('${song.id}')">+ Queue</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addToQueue(fileId) {
      const song = songs.find(s => s.id === fileId);
      if (!song) return;
      queue.push(song);
      updateCounts();
      if (document.getElementById('npCode').innerText === '-----') {
        playNext();
      }
    }

    function reserveByCode() {
      const input = document.getElementById('searchInput');
      const code = input.value.trim();
      const song = songs.find(s => s.code === code);
      if (song) {
        addToQueue(song.id);
        input.value = '';
        renderSongs();
      } else {
        alert('Song code not found: ' + code);
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      updateCounts();
      renderSongs();
    }

    function playSpecific(index) {
      const [song] = queue.splice(index, 1);
      updateCounts();
      renderSongs();
      startStream(song);
    }

    function playNext() {
      if (queue.length === 0) return;
      const nextSong = queue.shift();
      updateCounts();
      renderSongs();
      startStream(nextSong);
    }

    function playNow(fileId) {
      const song = songs.find(s => s.id === fileId);
      if (song) startStream(song);
    }

    function startStream(song) {
      document.getElementById('npCode').innerText = song.code;
      document.getElementById('npTitle').innerText = `${song.title} - ${song.artist}`;
      const stage = document.getElementById('playerStage');
      // Uses Google Drive's native web preview transcoder for .avi playback on iOS
      stage.innerHTML = `<iframe src="https://drive.google.com/file/d/${song.id}/preview" allow="autoplay; fullscreen" allowfullscreen></iframe>`;
    }
  </script>
</body>
</html>
