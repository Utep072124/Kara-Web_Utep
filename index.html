<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <link rel="icon" type="image/jpeg" href="icon.jpg" />
  <title>Kara-Web Utep</title>
  <script src="https://www.youtube.com/iframe_api"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #00d2ff;
      --accent2: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 10px 14px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .brand { font-weight: 800; font-size: 1.05rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .header-actions { display: flex; gap: 6px; }

    /* Video Stage */
    .stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 38dvh;
      background: #000; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid #1e293b; overflow: hidden;
    }
    #ytPlayerContainer, #ytPlayerContainer iframe, video { width: 100%; height: 100%; border: none; object-fit: contain; }

    /* Native Fullscreen Overlays (Hidden by default, shown via CSS when :fullscreen or webkit-fulllscreen is active) */
    .fs-top-hud, .fs-bottom-hud, .qr-overlay { display: none; }

    /* Active Fullscreen HUD Styles */
    .stage:fullscreen .fs-top-hud, .stage:-webkit-full-screen .fs-top-hud {
      display: flex; position: absolute; top: 0; left: 0; right: 0;
      padding: 12px 16px; background: linear-gradient(to bottom, rgba(0,0,0,0.8), transparent);
      justify-content: space-between; align-items: center; z-index: 99999; pointer-events: none;
    }
    .stage:fullscreen .fs-bottom-hud, .stage:-webkit-full-screen .fs-bottom-hud {
      display: flex; position: absolute; bottom: 0; left: 0; right: 0;
      padding: 16px; background: linear-gradient(to top, rgba(0,0,0,0.85), transparent);
      justify-content: center; align-items: center; gap: 8px; z-index: 99999;
    }
    .stage:fullscreen .qr-overlay, .stage:-webkit-full-screen .qr-overlay {
      display: flex; position: absolute; top: 50%; left: 24px; transform: translateY(-50%);
      width: 130px; background: rgba(11, 15, 25, 0.85); border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 8px; border-radius: 12px; flex-direction: column; align-items: center; text-align: center;
      z-index: 99998; backdrop-filter: blur(6px); box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }
    .stage:fullscreen .qr-overlay.hidden, .stage:-webkit-full-screen .qr-overlay.hidden { display: none !important; }

    .fs-up-next {
      background: rgba(15, 23, 42, 0.8); border: 1px solid rgba(0, 210, 255, 0.4);
      padding: 5px 10px; border-radius: 8px; font-size: 0.8rem; max-width: 60%;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: auto;
    }
    .fs-up-next span { color: var(--accent); font-weight: 700; margin-right: 4px; }

    .qr-card img { width: 110px; height: 110px; display: block; border-radius: 6px; }
    .qr-title { font-weight: 700; font-size: 0.68rem; color: #fff; margin-top: 4px; }

    /* Normal Mode QR Overlay (Inside regular stage view) */
    .qr-overlay-normal {
      position: absolute; inset: 0; background: radial-gradient(circle at center, #111827 0%, #050811 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center; padding: 16px; z-index: 15;
    }
    .qr-overlay-normal.hidden { display: none; }
    .qr-overlay-normal img { width: 120px; height: 120px; border-radius: 8px; margin-bottom: 6px; }

    /* Now Playing & Transport Controls */
    .now-playing {
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
      padding: 8px 14px; background: var(--card); border-bottom: 1px solid #1e293b;
    }
    .np-info { overflow: hidden; flex: 1; }
    .np-title { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .np-next-mini { font-size: 0.72rem; color: var(--accent); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
    .transport-btns { display: flex; gap: 5px; flex-shrink: 0; }

    .btn {
      background: linear-gradient(135deg, var(--accent), #0284c7); color: #fff; border: none;
      padding: 7px 11px; border-radius: 9px; font-weight: 600; font-size: 0.8rem; cursor: pointer;
    }
    .btn.secondary { background: #1e293b; color: var(--text); border: 1px solid #334155; }
    .btn.danger { background: #dc2626; }
    .btn.glass { background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255,255,255,0.2); backdrop-filter: blur(6px); pointer-events: auto; }

    /* Search Bar */
    .search-bar {
      display: flex; gap: 8px; padding: 10px 14px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .search-bar input {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 9px 12px; border-radius: 10px; font-size: 0.95rem; outline: none;
    }

    /* Tabs */
    .tabs { display: flex; background: #0f1524; border-bottom: 1px solid #1e293b; }
    .tab {
      flex: 1; text-align: center; padding: 9px; font-weight: 600; font-size: 0.82rem;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* List Area */
    .list-container { flex: 1; overflow-y: auto; padding: 10px 14px 30px; }
    .song-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px;
      border: 1px solid #1e293b;
    }
    .song-thumb { width: 60px; height: 45px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #000; }
    .song-meta { overflow: hidden; flex: 1; }
    .song-title { font-weight: 600; font-size: 0.88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .song-artist { font-size: 0.74rem; color: var(--muted); }
    .song-actions { display: flex; gap: 6px; flex-shrink: 0; }
    .placeholder { text-align: center; color: var(--muted); padding: 20px; font-size: 0.9rem; }

    .status-banner {
      background: #1e293b; color: var(--accent); font-size: 0.76rem; padding: 5px 14px; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KARA-WEB UTEP</div>
    <div class="header-actions">
      <input type="file" id="localFileInput" accept="video/mp4,video/quicktime,video/*" multiple style="display:none" onchange="handleLocalFiles(event)" />
      <button class="btn secondary" onclick="toggleQrOverlay()">📱 QR</button>
      <button class="btn secondary" onclick="document.getElementById('localFileInput').click()">+ File</button>
      <button class="btn" onclick="requestNativeFullscreen()">⛶ Stage</button>
    </div>
  </header>

  <div id="statusBanner" class="status-banner">Scan QR to open Songbook on any phone</div>

  <!-- Video Player Stage -->
  <div class="stage" id="playerStage">
    
    <!-- Native Fullscreen Top HUD -->
    <div class="fs-top-hud">
      <div class="fs-up-next" id="fsUpNext"><span>UP NEXT:</span> No song reserved</div>
      <button class="btn glass" onclick="exitNativeFullscreen()">✕ Exit Stage</button>
    </div>

    <!-- Native Fullscreen Left-Side Small QR Overlay (Interlude) -->
    <div class="qr-overlay" id="fsQrOverlay">
      <div class="qr-card">
        <img class="qrImgTag" alt="Scan QR" />
      </div>
      <div class="qr-title">Scan to Reserve</div>
    </div>

    <!-- Normal Mode Interlude / QR Code Screen -->
    <div class="qr-overlay-normal" id="normalQrOverlay">
      <img class="qrImgTag" alt="Scan to Open Kara-Web Utep" />
      <div style="font-weight:700; font-size:0.9rem; color:#fff; margin-top:4px;">Scan to Reserve Songs</div>
      <div style="font-size:0.75rem; color:var(--accent);">utep072124.github.io/Kara-Web_Utep</div>
    </div>

    <!-- Active Video Container -->
    <div id="mediaMount" style="width:100%; height:100%;"></div>

    <!-- Native Fullscreen Bottom Transport HUD -->
    <div class="fs-bottom-hud">
      <button class="btn glass" onclick="togglePlayPause()">⏯ Pause / Play</button>
      <button class="btn danger" onclick="stopPlayback()">⏹ Stop</button>
      <button class="btn" onclick="playNext()">⏭ Next Song</button>
    </div>
  </div>

  <!-- Now Playing & Transport Controls -->
  <div class="now-playing">
    <div class="np-info">
      <span class="np-title" id="npTitle">No song playing</span>
      <span class="np-next-mini" id="npNextMini">Up Next: Queue is empty</span>
    </div>
    <div class="transport-btns">
      <button class="btn secondary" onclick="togglePlayPause()" title="Play/Pause">⏯</button>
      <button class="btn danger" onclick="stopPlayback()" title="Stop">⏹</button>
      <button class="btn" onclick="playNext()" title="Next">⏭</button>
    </div>
  </div>

  <!-- Search Input Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search YouTube karaoke song..." onkeypress="if(event.key==='Enter') searchYouTube()" />
    <button class="btn" onclick="searchYouTube()">Search</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabSearch" onclick="switchTab('search')">Results / Files (<span id="resultCount">0</span>)</div>
    <div class="tab" id="tabQueue" onclick="switchTab('queue')">Reserved (<span id="queueCount">0</span>)</div>
  </div>

  <!-- Lists -->
  <div class="list-container" id="listContainer">
    <div class="placeholder"><p>Type a song above and tap Search</p></div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDBaE3nXzMESrJslYhZsn4ssGUOpVS1WZI';
    const APP_URL = 'https://utep072124.github.io/Kara-Web_Utep/';

    let searchResults = [];
    let queue = [];
    let currentTab = 'search';
    let ytPlayer = null;
    let activeMediaType = null;

    window.addEventListener('DOMContentLoaded', () => {
      const qrSrc = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(APP_URL)}`;
      document.querySelectorAll('.qrImgTag').forEach(img => img.src = qrSrc);
      updateUpNextLabels();
    });

    function requestNativeFullscreen() {
      const stage = document.getElementById('playerStage');
      if (stage.requestFullscreen) {
        stage.requestFullscreen();
      } else if (stage.webkitRequestFullscreen) {
        stage.webkitRequestFullscreen();
      }
    }

    function exitNativeFullscreen() {
      if (document.exitFullscreen) {
        document.exitFullscreen();
      } else if (document.webkitExitFullscreen) {
        document.webkitExitFullscreen();
      }
    }

    function toggleQrOverlay(forceState) {
      const normalOverlay = document.getElementById('normalQrOverlay');
      const fsOverlay = document.getElementById('fsQrOverlay');
      
      const shouldHide = typeof forceState === 'boolean' ? forceState : !normalOverlay.classList.contains('hidden');
      
      normalOverlay.classList.toggle('hidden', shouldHide);
      fsOverlay.classList.toggle('hidden', shouldHide);
    }

    function updateUpNextLabels() {
      const nextText = queue.length > 0 ? queue[0].title : 'No song reserved';
      document.getElementById('fsUpNext').innerHTML = `<span>UP NEXT:</span> ${nextText}`;
      document.getElementById('npNextMini').innerText = `Up Next: ${nextText}`;
    }

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
      document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
      renderList();
    }

    function updateCounts() {
      document.getElementById('queueCount').innerText = queue.length;
      document.getElementById('resultCount').innerText = searchResults.length;
      updateUpNextLabels();
    }

    function handleLocalFiles(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const localSongs = files.map((file, idx) => ({
        id: 'local_' + Date.now() + '_' + idx,
        type: 'local',
        url: URL.createObjectURL(file),
        title: file.name.replace(/\.[^/.]+$/, ''),
        channel: 'Local MP4/MOV File',
        thumbnail: ''
      }));

      searchResults = [...localSongs, ...searchResults];
      document.getElementById('statusBanner').innerText = `Loaded ${files.length} local file(s)`;
      switchTab('search');
      updateCounts();
    }

    async function searchYouTube() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const banner = document.getElementById('statusBanner');
      banner.innerText = 'Searching YouTube...';

      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query + ' karaoke')}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          banner.innerText = 'API Error: ' + data.error.message;
          return;
        }

        searchResults = (data.items || []).map(item => ({
          id: item.id.videoId,
          type: 'youtube',
          title: decodeHTML(item.snippet.title),
          channel: item.snippet.channelTitle,
          thumbnail: item.snippet.thumbnails.default.url
        }));

        banner.innerText = `Found ${searchResults.length} karaoke videos`;
        switchTab('search');
        updateCounts();
      } catch (err) {
        banner.innerText = 'Network error: ' + err.message;
      }
    }

    function decodeHTML(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (currentTab === 'queue') {
        if (queue.length === 0) {
          container.innerHTML = '<div class="placeholder"><p>Queue is empty. Reserve a song!</p></div>';
          return;
        }
        queue.forEach((song, idx) => {
          const div = document.createElement('div');
          div.className = 'song-item';
          div.innerHTML = `
            ${song.thumbnail ? `<img class="song-thumb" src="${song.thumbnail}" />` : ''}
            <div class="song-meta">
              <div class="song-title">#${idx + 1} • ${song.title}</div>
              <div class="song-artist">${song.channel}</div>
            </div>
            <div class="song-actions">
              <button class="btn" onclick="playSpecific(${idx})">Play</button>
              <button class="btn danger" onclick="removeFromQueue(${idx})">✕</button>
            </div>
          `;
          container.appendChild(div);
        });
        return;
      }

      if (searchResults.length === 0) {
        container.innerHTML = '<div class="placeholder"><p>No results yet. Search above or tap "+ File"</p></div>';
        return;
      }

      searchResults.forEach(song => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
          ${song.thumbnail ? `<img class="song-thumb" src="${song.thumbnail}" />` : ''}
          <div class="song-meta">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.channel}</div>
          </div>
          <div class="song-actions">
            <button class="btn secondary" onclick="playById('${song.id}')">Play</button>
            <button class="btn" onclick="addToQueue('${song.id}')">+ Queue</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addToQueue(id) {
      const song = searchResults.find(s => s.id === id);
      if (!song) return;
      queue.push(song);
      updateCounts();
      if (!activeMediaType) {
        playNext();
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      updateCounts();
      renderList();
    }

    function playSpecific(index) {
      const [song] = queue.splice(index, 1);
      updateCounts();
      renderList();
      startStream(song);
    }

    function playNext() {
      if (queue.length === 0) {
        stopPlayback();
        return;
      }
      const nextSong = queue.shift();
      updateCounts();
      renderList();
      startStream(nextSong);
    }

    function playById(id) {
      const song = searchResults.find(s => s.id === id);
      if (song) startStream(song);
    }

    function togglePlayPause() {
      if (activeMediaType === 'youtube' && ytPlayer && typeof ytPlayer.getPlayerState === 'function') {
        const state = ytPlayer.getPlayerState();
        if (state === YT.PlayerState.PLAYING) {
          ytPlayer.pauseVideo();
        } else {
          ytPlayer.playVideo();
          toggleQrOverlay(true);
        }
      } else if (activeMediaType === 'local') {
        const vid = document.getElementById('localVideoEl');
        if (vid) {
          if (vid.paused) {
            vid.play();
            toggleQrOverlay(true);
          } else {
            vid.pause();
          }
        }
      }
    }

    function stopPlayback() {
      activeMediaType = null;
      ytPlayer = null;
      document.getElementById('npTitle').innerText = 'Interlude — Ready for next singer';
      document.getElementById('mediaMount').innerHTML = '';
      toggleQrOverlay(false); // Show small QR on left / normal interlude screen
    }

    function startStream(song) {
      document.getElementById('npTitle').innerText = song.title;
      toggleQrOverlay(true); // Hide QR code during active singing
      const mount = document.getElementById('mediaMount');

      if (song.type === 'local') {
        activeMediaType = 'local';
        ytPlayer = null;
        mount.innerHTML = `<video id="localVideoEl" src="${song.url}" controls autoplay playsinline onended="playNext()"></video>`;
      } else {
        activeMediaType = 'youtube';
        mount.innerHTML = `<div id="ytPlayerContainer"></div>`;
        ytPlayer = new YT.Player('ytPlayerContainer', {
          videoId: song.id,
          playerVars: { autoplay: 1, playsinline: 1, rel: 0 },
          events: {
            onStateChange: (event) => {
              if (event.data === YT.PlayerState.ENDED) {
                playNext();
              }
            }
          }
        });
      }
    }
  </script>
</body>
</html>
