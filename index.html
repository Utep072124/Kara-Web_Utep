<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Kara-Web Utep</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #00d2ff;
      --accent2: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    /* Top Header */
    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .brand { font-weight: 800; font-size: 1.1rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    /* Video Stage */
    .stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 38dvh;
      background: #000; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid #1e293b;
    }
    iframe { width: 100%; height: 100%; border: none; }
    .placeholder { text-align: center; color: var(--muted); padding: 20px; }
    .placeholder h3 { color: var(--text); margin-bottom: 6px; font-size: 1.1rem; }

    /* Now Playing Bar */
    .now-playing {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px; background: var(--card); border-bottom: 1px solid #1e293b;
    }
    .np-info { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .np-title { font-weight: 600; font-size: 0.9rem; }
    .btn {
      background: linear-gradient(135deg, var(--accent), #0284c7); color: #fff; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    .btn.secondary { background: #1e293b; color: var(--text); }
    .btn.danger { background: #dc2626; }

    /* Search Bar */
    .search-bar {
      display: flex; gap: 8px; padding: 10px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .search-bar input {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 10px 12px; border-radius: 10px; font-size: 1rem; outline: none;
    }

    /* Tabs */
    .tabs { display: flex; background: #0f1524; border-bottom: 1px solid #1e293b; }
    .tab {
      flex: 1; text-align: center; padding: 10px; font-weight: 600; font-size: 0.85rem;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    /* List Area */
    .list-container { flex: 1; overflow-y: auto; padding: 10px 16px 30px; }
    .song-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px;
      border: 1px solid #1e293b;
    }
    .song-thumb { width: 60px; height: 45px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #000; }
    .song-meta { overflow: hidden; flex: 1; }
    .song-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 0.75rem; color: var(--muted); }
    .song-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .status-banner {
      background: #1e293b; color: var(--accent); font-size: 0.8rem; padding: 6px 16px; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KARA-WEB UTEP</div>
    <div style="font-size: 0.75rem; color: var(--muted);">YouTube Mode Active</div>
  </header>

  <div id="statusBanner" class="status-banner">Search YouTube for karaoke tracks instantly!</div>

  <!-- Video Player Stage -->
  <div class="stage" id="playerStage">
    <div class="placeholder">
      <h3>Ready to Sing</h3>
      <p>Search or select a song below</p>
    </div>
  </div>

  <!-- Now Playing Controls -->
  <div class="now-playing">
    <div class="np-info">
      <span class="np-title" id="npTitle">No song playing</span>
    </div>
    <button class="btn secondary" onclick="playNext()">Next ⏭</button>
  </div>

  <!-- Search Input Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Type song name + karaoke (e.g., My Way karaoke)..." onkeypress="if(event.key==='Enter') searchYouTube()" />
    <button class="btn" onclick="searchYouTube()">Search</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabSearch" onclick="switchTab('search')">Search Results</div>
    <div class="tab" id="tabQueue" onclick="switchTab('queue')">Reserved (<span id="queueCount">0</span>)</div>
  </div>

  <!-- Lists -->
  <div class="list-container" id="listContainer">
    <div class="placeholder"><p>Type a song above and tap Search</p></div>
  </div>

  <script>
    let searchResults = [];
    let queue = [];
    let currentTab = 'search';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
      document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
      renderList();
    }

    function updateCounts() {
      document.getElementById('queueCount').innerText = queue.length;
    }

    async function searchYouTube() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const banner = document.getElementById('statusBanner');
      banner.innerText = 'Searching YouTube...';

      try {
        // Using public Invidious / piped instances or direct YouTube JSON API fallback via client
        // For a reliable client-side search without a backend server, we can query YouTube's RSS/OEmbed or public APIs, 
        // or let users search easily. Let's use a robust public search endpoint or RSS feed:
        const res = await fetch(`https://pipedapi.kavin.rocks/search?q=${encodeURIComponent(query + ' karaoke')}&filter=videos`);
        const data = await res.json();
        
        if (data && data.items) {
          searchResults = data.items.map(item => ({
            id: item.url.replace('/watch?v=', ''),
            title: item.title,
            channel: item.uploaderName,
            thumbnail: item.thumbnail
          }));
        } else {
          searchResults = [];
        }

        banner.innerText = `Found ${searchResults.length} karaoke videos`;
        switchTab('search');
      } catch (err) {
        // Fallback or direct search helper if API is blocked
        banner.innerText = 'Search error. Try another keyword.';
      }
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (currentTab === 'queue') {
        if (queue.length === 0) {
          container.innerHTML = '<div class="placeholder"><p>Queue is empty. Search and add songs!</p></div>';
          return;
        }
        queue.forEach((song, idx) => {
          const div = document.createElement('div');
          div.className = 'song-item';
          div.innerHTML = `
            <img class="song-thumb" src="${song.thumbnail || ''}" />
            <div class="song-meta">
              <div class="song-title">${song.title}</div>
              <div class="song-artist">${song.channel}</div>
            </div>
            <div class="song-actions">
              <button class="btn" onclick="playSpecific(${idx})">Play</button>
              <button class="btn danger" onclick="removeFromQueue(${idx})">✕</button>
            </div>
          `;
          container.appendChild(div);
        });
        return;
      }

      if (searchResults.length === 0) {
        container.innerHTML = '<div class="placeholder"><p>No results yet. Type a song above!</p></div>';
        return;
      }

      searchResults.forEach(song => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
          <img class="song-thumb" src="${song.thumbnail || ''}" />
          <div class="song-meta">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.channel}</div>
          </div>
          <div class="song-actions">
            <button class="btn secondary" onclick="playNow('${song.id}', '${encodeURIComponent(song.title)}')">Play</button>
            <button class="btn" onclick="addToQueue('${song.id}')">+ Queue</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addToQueue(videoId) {
      const song = searchResults.find(s => s.id === videoId);
      if (!song) return;
      queue.push(song);
      updateCounts();
      if (document.getElementById('npTitle').innerText === 'No song playing') {
        playNext();
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      updateCounts();
      renderList();
    }

    function playSpecific(index) {
      const [song] = queue.splice(index, 1);
      updateCounts();
      renderList();
      startStream(song.id, song.title);
    }

    function playNext() {
      if (queue.length === 0) return;
      const nextSong = queue.shift();
      updateCounts();
      renderList();
      startStream(nextSong.id, nextSong.title);
    }

    function playNow(videoId, encodedTitle) {
      startStream(videoId, decodeURIComponent(encodedTitle));
    }

    function startStream(videoId, title) {
      document.getElementById('npTitle').innerText = title;
      const stage = document.getElementById('playerStage');
      stage.innerHTML = `<iframe src="https://www.youtube.com/embed/${videoId}?autoplay=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
    }
  </script>
</body>
</html>
