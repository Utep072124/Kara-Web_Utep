<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="apple-touch-icon" href="icon.jpg" />
  <link rel="icon" type="image/jpeg" href="icon.jpg" />
  <title>Kara-Web Utep</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --accent: #00d2ff;
      --accent2: #a855f7;
      --text: #f8fafc;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }

    header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .brand { font-weight: 800; font-size: 1.1rem; background: linear-gradient(90deg, var(--accent), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .stage {
      position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 38dvh;
      background: #000; display: flex; align-items: center; justify-content: center;
      border-bottom: 1px solid #1e293b;
    }
    iframe, video { width: 100%; height: 100%; border: none; object-fit: contain; }
    .placeholder { text-align: center; color: var(--muted); padding: 20px; }
    .placeholder h3 { color: var(--text); margin-bottom: 6px; font-size: 1.1rem; }

    .now-playing {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      padding: 10px 16px; background: var(--card); border-bottom: 1px solid #1e293b;
    }
    .np-info { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .np-title { font-weight: 600; font-size: 0.9rem; }
    .btn {
      background: linear-gradient(135deg, var(--accent), #0284c7); color: #fff; border: none;
      padding: 8px 12px; border-radius: 10px; font-weight: 600; font-size: 0.82rem; cursor: pointer;
    }
    .btn.secondary { background: #1e293b; color: var(--text); }
    .btn.danger { background: #dc2626; }

    .search-bar {
      display: flex; gap: 8px; padding: 10px 16px; background: #0f1524; border-bottom: 1px solid #1e293b;
    }
    .search-bar input {
      flex: 1; background: #1e293b; border: 1px solid #334155; color: #fff;
      padding: 10px 12px; border-radius: 10px; font-size: 1rem; outline: none;
    }

    .tabs { display: flex; background: #0f1524; border-bottom: 1px solid #1e293b; }
    .tab {
      flex: 1; text-align: center; padding: 10px; font-weight: 600; font-size: 0.85rem;
      color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent;
    }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }

    .list-container { flex: 1; overflow-y: auto; padding: 10px 16px 30px; }
    .song-item {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
      background: var(--card); padding: 10px 12px; border-radius: 12px; margin-bottom: 8px;
      border: 1px solid #1e293b;
    }
    .song-thumb { width: 64px; height: 48px; border-radius: 6px; object-fit: cover; flex-shrink: 0; background: #000; }
    .song-meta { overflow: hidden; flex: 1; }
    .song-title { font-weight: 600; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 3px; }
    .song-artist { font-size: 0.75rem; color: var(--muted); }
    .song-actions { display: flex; gap: 6px; flex-shrink: 0; }

    .status-banner {
      background: #1e293b; color: var(--accent); font-size: 0.8rem; padding: 6px 16px; text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand">KARA-WEB UTEP</div>
    <div>
      <input type="file" id="localFileInput" accept="video/*" multiple style="display:none" onchange="handleLocalFiles(event)" />
      <button class="btn secondary" onclick="document.getElementById('localFileInput').click()">+ Load File</button>
    </div>
  </header>

  <div id="statusBanner" class="status-banner">Search YouTube or tap "+ Load File" for local videos</div>

  <!-- Video Player Stage -->
  <div class="stage" id="playerStage">
    <div class="placeholder">
      <h3>Ready to Sing</h3>
      <p>Search YouTube or load a local video file</p>
    </div>
  </div>

  <!-- Now Playing Controls -->
  <div class="now-playing">
    <div class="np-info">
      <span class="np-title" id="npTitle">No song playing</span>
    </div>
    <button class="btn secondary" onclick="playNext()">Next ⏭</button>
  </div>

  <!-- Search Input Bar -->
  <div class="search-bar">
    <input type="text" id="searchInput" placeholder="Search song (e.g., You've Got a Friend)..." onkeypress="if(event.key==='Enter') searchYouTube()" />
    <button class="btn" onclick="searchYouTube()">Search</button>
  </div>

  <!-- Tabs -->
  <div class="tabs">
    <div class="tab active" id="tabSearch" onclick="switchTab('search')">Results / Files (<span id="resultCount">0</span>)</div>
    <div class="tab" id="tabQueue" onclick="switchTab('queue')">Reserved (<span id="queueCount">0</span>)</div>
  </div>

  <!-- Lists -->
  <div class="list-container" id="listContainer">
    <div class="placeholder"><p>Type a song above and tap Search</p></div>
  </div>

  <script>
    const YOUTUBE_API_KEY = 'AIzaSyDBaE3nXzMESrJslYhZsn4ssGUOpVS1WZI';

    let searchResults = [];
    let queue = [];
    let currentTab = 'search';

    function switchTab(tab) {
      currentTab = tab;
      document.getElementById('tabSearch').classList.toggle('active', tab === 'search');
      document.getElementById('tabQueue').classList.toggle('active', tab === 'queue');
      renderList();
    }

    function updateCounts() {
      document.getElementById('queueCount').innerText = queue.length;
      document.getElementById('resultCount').innerText = searchResults.length;
    }

    function handleLocalFiles(event) {
      const files = Array.from(event.target.files);
      if (!files.length) return;

      const localSongs = files.map((file, idx) => ({
        id: 'local_' + Date.now() + '_' + idx,
        type: 'local',
        url: URL.createObjectURL(file),
        title: file.name.replace(/\.[^/.]+$/, ''),
        channel: 'Local Device File',
        thumbnail: ''
      }));

      searchResults = [...localSongs, ...searchResults];
      document.getElementById('statusBanner').innerText = `Loaded ${files.length} local file(s)`;
      switchTab('search');
      updateCounts();
    }

    async function searchYouTube() {
      const query = document.getElementById('searchInput').value.trim();
      if (!query) return;

      const banner = document.getElementById('statusBanner');
      banner.innerText = 'Searching YouTube...';

      try {
        const url = `https://www.googleapis.com/youtube/v3/search?part=snippet&type=video&maxResults=20&q=${encodeURIComponent(query + ' karaoke')}&key=${YOUTUBE_API_KEY}`;
        const res = await fetch(url);
        const data = await res.json();

        if (data.error) {
          banner.innerText = 'API Error: ' + data.error.message;
          return;
        }

        searchResults = (data.items || []).map(item => ({
          id: item.id.videoId,
          type: 'youtube',
          title: decodeHTML(item.snippet.title),
          channel: item.snippet.channelTitle,
          thumbnail: item.snippet.thumbnails.default.url
        }));

        banner.innerText = `Found ${searchResults.length} karaoke videos`;
        switchTab('search');
        updateCounts();
      } catch (err) {
        banner.innerText = 'Network error: ' + err.message;
      }
    }

    function decodeHTML(str) {
      const txt = document.createElement('textarea');
      txt.innerHTML = str;
      return txt.value;
    }

    function renderList() {
      const container = document.getElementById('listContainer');
      container.innerHTML = '';

      if (currentTab === 'queue') {
        if (queue.length === 0) {
          container.innerHTML = '<div class="placeholder"><p>Queue is empty. Search or load files!</p></div>';
          return;
        }
        queue.forEach((song, idx) => {
          const div = document.createElement('div');
          div.className = 'song-item';
          div.innerHTML = `
            ${song.thumbnail ? `<img class="song-thumb" src="${song.thumbnail}" />` : ''}
            <div class="song-meta">
              <div class="song-title">#${idx + 1} • ${song.title}</div>
              <div class="song-artist">${song.channel}</div>
            </div>
            <div class="song-actions">
              <button class="btn" onclick="playSpecific(${idx})">Play</button>
              <button class="btn danger" onclick="removeFromQueue(${idx})">✕</button>
            </div>
          `;
          container.appendChild(div);
        });
        return;
      }

      if (searchResults.length === 0) {
        container.innerHTML = '<div class="placeholder"><p>No results yet. Search above or tap "+ Load File"</p></div>';
        return;
      }

      searchResults.forEach(song => {
        const div = document.createElement('div');
        div.className = 'song-item';
        div.innerHTML = `
          ${song.thumbnail ? `<img class="song-thumb" src="${song.thumbnail}" />` : ''}
          <div class="song-meta">
            <div class="song-title">${song.title}</div>
            <div class="song-artist">${song.channel}</div>
          </div>
          <div class="song-actions">
            <button class="btn secondary" onclick="playById('${song.id}')">Play</button>
            <button class="btn" onclick="addToQueue('${song.id}')">+ Queue</button>
          </div>
        `;
        container.appendChild(div);
      });
    }

    function addToQueue(id) {
      const song = searchResults.find(s => s.id === id);
      if (!song) return;
      queue.push(song);
      updateCounts();
      if (document.getElementById('npTitle').innerText === 'No song playing') {
        playNext();
      }
    }

    function removeFromQueue(index) {
      queue.splice(index, 1);
      updateCounts();
      renderList();
    }

    function playSpecific(index) {
      const [song] = queue.splice(index, 1);
      updateCounts();
      renderList();
      startStream(song);
    }

    function playNext() {
      if (queue.length === 0) return;
      const nextSong = queue.shift();
      updateCounts();
      renderList();
      startStream(nextSong);
    }

    function playById(id) {
      const song = searchResults.find(s => s.id === id);
      if (song) startStream(song);
    }

    function startStream(song) {
      document.getElementById('npTitle').innerText = song.title;
      const stage = document.getElementById('playerStage');

      if (song.type === 'local') {
        stage.innerHTML = `<video src="${song.url}" controls autoplay playsinline onended="playNext()"></video>`;
      } else {
        stage.innerHTML = `<iframe src="https://www.youtube.com/embed/${song.id}?autoplay=1&playsinline=1" allow="autoplay; encrypted-media; fullscreen" allowfullscreen></iframe>`;
      }
    }
  </script>
</body>
</html>
